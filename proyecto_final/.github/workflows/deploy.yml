name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend_fastapi/**"
      - ".github/workflows/**"
      - "vercel.json"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend_fastapi/requirements.txt
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Backend lint, tests, and contract
        working-directory: backend_fastapi
        env:
          SECRET_KEY: CI_ONLY_SECRET_KEY_REPLACE_THIS_VALUE
          DATABASE_URL: mysql+pymysql://ci:ci@127.0.0.1:3306/ci?charset=utf8mb4
        run: |
          python -m pip install -r requirements.txt ruff schemathesis
          ruff check app tests alembic
          ruff format --check app tests alembic
          pytest -q
          uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/payments-api.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          schemathesis run http://127.0.0.1:8000/openapi.json --dry-run --validate-schema=true

  migrate:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend_fastapi/requirements.txt
      - name: Apply Alembic migrations to production TiDB
        working-directory: backend_fastapi
        env:
          DATABASE_URL: ${{ secrets.TIDB_PRODUCTION_DATABASE_URL }}
          DATABASE_SSL_VERIFY: "true"
        run: |
          python -m pip install -r requirements.txt
          alembic upgrade head
      - name: Apply payment migrations to PostgreSQL
        working-directory: backend_fastapi
        env:
          PAYMENTS_DATABASE_URL: ${{ secrets.PAYMENTS_DATABASE_URL }}
        run: |
          python -m pip install -r requirements.txt
          alembic -c payments_alembic.ini upgrade head

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy both services to production
        id: deploy
        run: |
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Wait for API and TiDB health
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 20 "$DEPLOY_URL/api/health" || true)
            if [ "$code" = "200" ] && grep -q '"estado":"ok"' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP ${code:-no response}; waiting $((attempt * 6))s"
            sleep $((attempt * 6))
          done
          echo "Backend/TiDB did not become healthy after deployment."
          exit 1
